name: Deploy application

permissions: {}

on:
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

jobs:
  publish-integration-tests-image:
    if: false # CHANGEME remove this when you are ready to deploy
    runs-on: ubuntu-latest
    permissions:
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false

      - name: Assume AWS role
        uses: aws-actions/configure-aws-credentials@517a711dbcd0e402f90c77e7e2f81e849156e31d
        with:
          # CHANGEME add a GitHub secret called PIPELINE_GH_ACTIONS_ROLE_ARN
          # with the value of the GitHubActionsRoleArn output from your build pipeline stack
          # see https://github.com/govuk-one-login/devplatform-deploy/tree/main/sam-deploy-pipeline
          role-to-assume: ${{ secrets.PIPELINE_GH_ACTIONS_ROLE_ARN }}
          aws-region: "eu-west-2"

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@d539f0932e70871a027e9d5a9d8fc38589180a64

      - name: Build & publish Docker image
        working-directory: solutions/integration-tests
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          # CHANGEME add a GitHub secret called POST_DEPLOY_TESTS_IMAGE_REPOSITORY
          # with the value of the name of your build test image repository
          # see https://github.com/govuk-one-login/devplatform-deploy/tree/main/test-image-repository
          ECR_REPOSITORY: ${{ secrets.POST_DEPLOY_TESTS_IMAGE_REPOSITORY }}
        run: |
          docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:$GITHUB_SHA -t $ECR_REGISTRY/$ECR_REPOSITORY:latest .
          docker push -a $ECR_REGISTRY/$ECR_REPOSITORY

  deploy:
    if: false # CHANGEME remove this when you are ready to deploy
    needs: publish-integration-tests-image
    runs-on: ubuntu-latest
    permissions:
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: .nvmrc

      - name: Assume AWS role
        uses: aws-actions/configure-aws-credentials@517a711dbcd0e402f90c77e7e2f81e849156e31d
        with:
          # CHANGEME add a GitHub secret called PIPELINE_GH_ACTIONS_ROLE_ARN
          # with the value of the GitHubActionsRoleArn output from your build pipeline stack
          # see https://github.com/govuk-one-login/devplatform-deploy/tree/main/sam-deploy-pipeline
          role-to-assume: ${{ secrets.PIPELINE_GH_ACTIONS_ROLE_ARN }}
          aws-region: "eu-west-2"

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Build
        run: npm run build

      - name: Test
        run: npm run test:coverage

      - name: Deploy
        uses: govuk-one-login/devplatform-upload-action@64e46134b4108ebfa1cf2a64fee00782f8e2e8cf
        with:
          # CHANGEME add a GitHub secret called PIPELINE_SOURCE_BUCKET_NAME
          # with the value of the GitHubArtifactSourceBucketName output from your build pipeline stack
          # see https://github.com/govuk-one-login/devplatform-deploy/tree/main/sam-deploy-pipeline
          artifact-bucket-name: ${{ secrets.PIPELINE_SOURCE_BUCKET_NAME }}
          # CHANGEME add a GitHub secret called SIGNING_PROFILE_NAME
          # with the value of the SigningProfileName output from your build signer stack
          # see https://github.com/govuk-one-login/devplatform-deploy/tree/main/signer
          signing-profile-name: ${{ secrets.SIGNING_PROFILE_NAME }}
          working-directory: ./solutions/app-infra
          template-file: .aws-sam/build/template.yaml
