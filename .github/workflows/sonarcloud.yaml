name: SonarCloud

permissions: {}

on:
  pull_request:
  merge_group:
  push:
    branches:
      - main

jobs:
  sonarcloud:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: .nvmrc

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Run tests and report coverage
        run: npm run test:coverage

      - name: SonarQube scan
        uses: SonarSource/sonarqube-scan-action@ba9859eae8dd6bd29e412f25ddbbef3d032000f4
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # CHANGEME add a GitHub secret called SONAR_TOKEN
          # with the value of your project's SonarCloud token
          # CHANGEME add a GitHub Dependabot secret called SONAR_TOKEN
          # with the value of your project's SonarCloud token
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
