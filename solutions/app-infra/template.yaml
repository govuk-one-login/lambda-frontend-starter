AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31

Parameters:
  Environment:
    Type: String
    Description: >
      The environment type. Provided by the deployment pipeline.
    AllowedValues:
      - "dev"
      - "build"
      - "staging"
      - "integration"
      - "production"
  CodeSigningConfigArn:
    Type: String
    Description: >
      The ARN of the code signing config to use. Provided by the deployment pipeline.
    Default: "none"
  PermissionsBoundary:
    Type: String
    Description: >
      The ARN of the permissions boundary to apply to any role created by the template. Provided by the deployment pipeline.
    Default: "none"
  VpcStackName:
    Type: String
    Description: >
      The name of the stack that defines the VPC in which resources will be located. Provided by the deployment pipeline.
  LambdaDeploymentPreference:
    Description: >
      The default canary deployment preference for lambdas. The default will be used if the  value is not provided by the deployment pipeline.
    Type: String
    Default: "AllAtOnce"
    AllowedValues:
      - Canary10Percent30Minutes
      - Canary10Percent5Minutes
      - Canary10Percent10Minutes
      - Canary10Percent15Minutes
      - Linear10PercentEvery10Minutes
      - Linear10PercentEvery1Minute
      - Linear10PercentEvery2Minutes
      - Linear10PercentEvery3Minutes
      - AllAtOnce
  AlertsStackName:
    Type: String
    Description: >
      The name of a Dev Platform build notifications stack that contains SNS topics for alarms (https://github.com/govuk-one-login/devplatform-deploy/tree/main/build-notifications)
    Default: "CHANGEME"
  CertificateStackName:
    Type: String
    Description: >
      The name of a Dev Platform certificate stack in eu-west-2, configured for use with this application's domain (https://github.com/govuk-one-login/devplatform-deploy/tree/main/certificate)
    Default: "CHANGEME"
  CloudFrontStackName:
    Type: String
    Description: >
      The name of a Dev Platform CloudFront stack configured for use with this application (https://github.com/govuk-one-login/devplatform-deploy/tree/main/cloudfront-distribution)
    Default: "CHANGEME"
  HostedZoneStackName:
    Type: String
    Description: >
      The name of a stack which configures the hosted zone for your application's domain. The stack should export a HostedZoneId output.
      There is no Dev Platform stack so this needs to be a custom stack. See https://github.com/govuk-one-login/account-components/blob/main/solutions/infra/hosted_zone.tf
      for how this is configured for Account Components.
    Default: "CHANGEME"

Mappings:
  EnvironmentConfiguration:
    dev:
      dynatraceSecretArn: arn:aws:secretsmanager:eu-west-2:216552277552:secret:DynatraceNonProductionVariables # pragma: allowlist secret
      powertoolsLogLevel: DEBUG
      useCanary: false
      frontendDomain: CHANGEME # e.g manage.dev.account.gov.uk
      authFrontendUrl: https://signin.dev.account.gov.uk
      analyticsCookieDomain: dev.account.gov.uk
      ga4ContainerId: CHANGEME
      analyticsEnabled: "1"
      rootDomainWithEnv: dev.account.gov.uk
    build:
      dynatraceSecretArn: arn:aws:secretsmanager:eu-west-2:216552277552:secret:DynatraceNonProductionVariables # pragma: allowlist secret
      powertoolsLogLevel: INFO
      useCanary: false
      frontendDomain: CHANGEME # e.g manage.build.account.gov.uk
      authFrontendUrl: https://signin.build.account.gov.uk
      analyticsCookieDomain: build.account.gov.uk
      ga4ContainerId: CHANGEME
      analyticsEnabled: "1"
      rootDomainWithEnv: build.account.gov.uk
    staging:
      dynatraceSecretArn: arn:aws:secretsmanager:eu-west-2:216552277552:secret:DynatraceNonProductionVariables # pragma: allowlist secret
      powertoolsLogLevel: INFO
      useCanary: true
      frontendDomain: CHANGEME # e.g manage.staging.account.gov.uk
      authFrontendUrl: https://signin.staging.account.gov.uk
      analyticsCookieDomain: staging.account.gov.uk
      ga4ContainerId: CHANGEME
      analyticsEnabled: "1"
      rootDomainWithEnv: staging.account.gov.uk
    integration:
      dynatraceSecretArn: arn:aws:secretsmanager:eu-west-2:216552277552:secret:DynatraceNonProductionVariables # pragma: allowlist secret
      powertoolsLogLevel: INFO
      useCanary: true
      frontendDomain: CHANGEME # e.g manage.integration.account.gov.uk
      authFrontendUrl: https://signin.integration.account.gov.uk
      analyticsCookieDomain: integration.account.gov.uk
      ga4ContainerId: CHANGEME
      analyticsEnabled: "0"
      rootDomainWithEnv: integration.account.gov.uk
    production:
      dynatraceSecretArn: arn:aws:secretsmanager:eu-west-2:216552277552:secret:DynatraceProductionVariables # pragma: allowlist secret
      powertoolsLogLevel: INFO
      useCanary: true
      frontendDomain: CHANGEME # e.g manage.account.gov.uk
      authFrontendUrl: https://signin.account.gov.uk
      analyticsCookieDomain: account.gov.uk
      ga4ContainerId: CHANGEME
      analyticsEnabled: "1"
      rootDomainWithEnv: account.gov.uk

Conditions:
  UseCodeSigning:
    Fn::Not:
      - Fn::Equals:
          - !Ref CodeSigningConfigArn
          - "none"
  UsePermissionsBoundary:
    Fn::Not:
      - Fn::Equals:
          - !Ref PermissionsBoundary
          - "none"
  IsLocal:
    Fn::Equals:
      - !Ref "AWS::Region"
      - "local"
  CanariesEnabled: !Equals
    - !FindInMap [EnvironmentConfiguration, !Ref Environment, useCanary]
    - true
  IsProduction: !Equals [!Ref Environment, "production"]
  IsDevEnvironment: !Equals [!Ref Environment, "dev"]
  IsLocalOrDev: !Or [Condition: IsDevEnvironment, Condition: IsLocal]

Globals:
  Function:
    DeploymentPreference:
      Enabled: !If [CanariesEnabled, true, false]
      Type: !Ref LambdaDeploymentPreference
      Role: !GetAtt CodeDeployServiceRole.Arn
    Tracing: Active
    AutoPublishAlias: live
    KmsKeyArn: !GetAtt LambdaEnvironmentVariableEncryptionKey.Arn
    Layers:
      - !If [
          IsLocal,
          !Ref AWS::NoValue,
          "arn:aws:lambda:eu-west-2:216552277552:layer:Dynatrace_OneAgent_1_329_73_20260123-140641_with_collector_nodejs_arm:1",
        ]
    CodeSigningConfigArn: !If
      - UseCodeSigning
      - !Ref CodeSigningConfigArn
      - !Ref AWS::NoValue
    PermissionsBoundary: !If
      - UsePermissionsBoundary
      - !Ref PermissionsBoundary
      - !Ref AWS::NoValue
    VpcConfig:
      SubnetIds:
        - Fn::ImportValue: !Sub ${VpcStackName}-PrivateSubnetIdA
        - Fn::ImportValue: !Sub ${VpcStackName}-PrivateSubnetIdB
        - Fn::ImportValue: !Sub ${VpcStackName}-PrivateSubnetIdC
      SecurityGroupIds:
        - Fn::ImportValue: !Sub ${VpcStackName}-AWSServicesEndpointSecurityGroupId
    Timeout: 10
    MemorySize: 1769 # so that we get ~1 VCPU
    Architectures:
      - arm64
    Runtime: nodejs24.x
    Environment:
      Variables:
        POWERTOOLS_LOG_LEVEL:
          !FindInMap [
            EnvironmentConfiguration,
            !Ref Environment,
            powertoolsLogLevel,
          ]
        POWERTOOLS_SERVICE_NAME: !Ref AWS::StackName
        POWERTOOLS_PARAMETERS_MAX_AGE: 300
        AWS_XRAY_CONTEXT_MISSING: IGNORE_ERROR
        NODE_OPTIONS:
          !If [IsLocalOrDev, "--enable-source-maps", !Ref AWS::NoValue]
        USE_LOCAL_AWS: !Ref AWS::NoValue
        ENVIRONMENT: !Ref Environment
        NODE_ENV: "production"
        LOCAL_AWS_ENDPOINT: !Ref AWS::NoValue
        LOCAL_AWS_ACCESS_KEY_ID: !Ref AWS::NoValue
        LOCAL_AWS_ACCESS_KEY: !Ref AWS::NoValue
        LOCAL_AWS_KMS_ENDPOINT: !Ref AWS::NoValue
        AWS_LAMBDA_EXEC_WRAPPER:
          !If [IsLocal, !Ref AWS::NoValue, "/opt/dynatrace"]
        DT_CONNECTION_AUTH_TOKEN: !Sub
          - "{{resolve:secretsmanager:${SecretArn}:SecretString:DT_CONNECTION_AUTH_TOKEN}}" # pragma: allowlist secret
          - SecretArn:
              !FindInMap [
                EnvironmentConfiguration,
                !Ref Environment,
                dynatraceSecretArn,
              ]
        DT_CONNECTION_BASE_URL: !Sub
          - "{{resolve:secretsmanager:${SecretArn}:SecretString:DT_CONNECTION_BASE_URL}}" # pragma: allowlist secret
          - SecretArn:
              !FindInMap [
                EnvironmentConfiguration,
                !Ref Environment,
                dynatraceSecretArn,
              ]
        DT_CLUSTER_ID: !Sub
          - "{{resolve:secretsmanager:${SecretArn}:SecretString:DT_CLUSTER_ID}}" # pragma: allowlist secret
          - SecretArn:
              !FindInMap [
                EnvironmentConfiguration,
                !Ref Environment,
                dynatraceSecretArn,
              ]
        DT_LOG_COLLECTION_AUTH_TOKEN: !Sub
          - "{{resolve:secretsmanager:${SecretArn}:SecretString:DT_LOG_COLLECTION_AUTH_TOKEN}}" # pragma: allowlist secret
          - SecretArn:
              !FindInMap [
                EnvironmentConfiguration,
                !Ref Environment,
                dynatraceSecretArn,
              ]
        DT_TENANT: !Sub
          - "{{resolve:secretsmanager:${SecretArn}:SecretString:DT_TENANT}}" # pragma: allowlist secret
          - SecretArn:
              !FindInMap [
                EnvironmentConfiguration,
                !Ref Environment,
                dynatraceSecretArn,
              ]
        DT_LOGGING_NODEJS_FLAGS: Exporter=true,LambdaSensor=false
        DT_OPEN_TELEMETRY_ENABLE_INTEGRATION: true
        DT_OPEN_TELEMETRY_ALLOW_EXPLICIT_PARENT: true

Resources:
  CodeDeployServiceRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Action:
              - sts:AssumeRole
            Effect: Allow
            Principal:
              Service:
                - codedeploy.amazonaws.com
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSCodeDeployRoleForLambda
      PermissionsBoundary:
        !If [
          UsePermissionsBoundary,
          !Ref PermissionsBoundary,
          !Ref AWS::NoValue,
        ]

  DynamoDbSSEKey:
    Type: AWS::KMS::Key
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      EnableKeyRotation: true
      KeyPolicy:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              AWS: !Sub "arn:aws:iam::${AWS::AccountId}:root"
            Action:
              - "kms:*"
            Resource: "*"
          - Effect: Allow
            Principal:
              Service: "dynamodb.amazonaws.com"
            Action:
              - "kms:Encrypt"
              - "kms:Decrypt"
              - "kms:ReEncrypt*"
              - "kms:GenerateDataKey*"
              - "kms:DescribeKey"
              - "kms:CreateGrant"
            Resource: "*"
            Condition:
              ArnLike:
                aws:SourceArn: !Sub "arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/*"

  DynamoDbSSEKeyAlias:
    Type: AWS::KMS::Alias
    Properties:
      AliasName: !Sub "alias/${AWS::StackName}-DynamoDbSSEKey"
      TargetKeyId: !GetAtt DynamoDbSSEKey.Arn

  CloudWatchEncryptionKey:
    Type: AWS::KMS::Key
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      EnableKeyRotation: true
      KeyPolicy:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              AWS: !Sub "arn:aws:iam::${AWS::AccountId}:root"
            Action: "kms:*"
            Resource: "*"
          - Effect: Allow
            Principal:
              Service: !Sub "logs.${AWS::Region}.amazonaws.com"
            Action:
              - "kms:Encrypt*"
              - "kms:Decrypt*"
              - "kms:ReEncrypt*"
              - "kms:GenerateDataKey*"
              - "kms:Describe*"
            Resource: "*"
            Condition:
              ArnLike:
                "kms:EncryptionContext:aws:logs:arn": !Sub "arn:aws:logs:${AWS::Region}:${AWS::AccountId}:*"

  CloudWatchEncryptionKeyAlias:
    Type: AWS::KMS::Alias
    Properties:
      AliasName: !Sub "alias/${AWS::StackName}-CloudWatchEncryptionKey"
      TargetKeyId: !GetAtt CloudWatchEncryptionKey.Arn

  LambdaEnvironmentVariableEncryptionKey:
    Type: AWS::KMS::Key
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      EnableKeyRotation: true
      KeyPolicy:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              AWS: !Sub "arn:aws:iam::${AWS::AccountId}:root"
            Action:
              - kms:*
            Resource: "*"
          - Effect: "Allow"
            Principal:
              Service: lambda.amazonaws.com
            Action:
              - "kms:Decrypt"
            Resource: "*"
            Condition:
              ArnLike:
                "aws:SourceArn": !Sub "arn:aws:lambda:${AWS::Region}:${AWS::AccountId}:function:*"

  LambdaEnvironmentVariableEncryptionKeyAlias:
    Type: AWS::KMS::Alias
    Properties:
      AliasName: !Sub "alias/${AWS::StackName}-LambdaEnvironmentVariableEncryptionKey"
      TargetKeyId: !GetAtt LambdaEnvironmentVariableEncryptionKey.Arn

  SecretsKmsKey:
    Type: AWS::KMS::Key
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      EnableKeyRotation: true
      KeyPolicy:
        Statement:
          - Effect: Allow
            Principal:
              AWS: !Sub "arn:aws:iam::${AWS::AccountId}:root"
            Action: "kms:*"
            Resource: "*"

  SecretsKmsKeyAlias:
    Type: AWS::KMS::Alias
    Properties:
      AliasName: !Sub "alias/${AWS::StackName}-SecretsKmsKey"
      TargetKeyId: !GetAtt SecretsKmsKey.Arn

  LambdaClaimedAccountConcurrencyAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      Namespace: AWS/Lambda
      MetricName: ClaimedAccountConcurrency
      Statistic: Maximum
      Period: 60
      EvaluationPeriods: 10
      DatapointsToAlarm: 10
      Threshold: 900
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - Fn::ImportValue: !Sub ${AlertsStackName}-CriticalAlertsTopicArn # CHANGEME change as necessary for your application

  SessionSecret:
    Type: AWS::SecretsManager::Secret
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      GenerateSecretString:
        PasswordLength: 64
      KmsKeyId: !Ref SecretsKmsKey

  SessionsTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Metadata:
      checkov:
        skip:
          - id: "CKV_AWS_28"
            comment: "Sessions table does not require point in time recovery as session data is ephemeral"
    Properties:
      TableName: !Sub ${AWS::StackName}-SessionStore
      AttributeDefinitions:
        - AttributeName: "id"
          AttributeType: "S"
      KeySchema:
        - AttributeName: "id"
          KeyType: "HASH"
      TimeToLiveSpecification:
        AttributeName: "expires"
        Enabled: true
      BillingMode: PAY_PER_REQUEST
      ContributorInsightsSpecification:
        Enabled: true
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: false
      SSESpecification:
        KMSMasterKeyId: !GetAtt DynamoDbSSEKey.Arn
        SSEEnabled: true
        SSEType: KMS
      TableClass: STANDARD

  FrontendApiDomain:
    Type: AWS::ApiGateway::DomainName
    Properties:
      DomainName:
        !FindInMap [EnvironmentConfiguration, !Ref Environment, frontendDomain]
      RegionalCertificateArn:
        Fn::ImportValue: !Sub ${CertificateStackName}-CertificateARN
      EndpointConfiguration:
        Types:
          - REGIONAL
      SecurityPolicy: SecurityPolicy_TLS13_1_2_FIPS_PQ_2025_09
      EndpointAccessMode: STRICT

  FrontendApiOriginRecord:
    Type: AWS::Route53::RecordSet
    Properties:
      Name: !Sub
        - "origin.${BaseAlias}"
        - BaseAlias:
            !FindInMap [
              EnvironmentConfiguration,
              !Ref Environment,
              frontendDomain,
            ]
      Type: A
      HostedZoneId:
        Fn::ImportValue: !Sub ${HostedZoneStackName}-HostedZoneId
      AliasTarget:
        DNSName: !GetAtt FrontendApiDomain.RegionalDomainName
        HostedZoneId: !GetAtt FrontendApiDomain.RegionalHostedZoneId
        EvaluateTargetHealth: false

  FrontendApiWafAssociation:
    Type: "AWS::WAFv2::WebACLAssociation"
    Properties:
      WebACLArn:
        Fn::ImportValue: !Sub ${CloudFrontStackName}-CloakingOriginWebACLArn
      ResourceArn: !Sub "arn:aws:apigateway:${AWS::Region}::/restapis/${FrontendApiGateway}/stages/${Environment}"
    DependsOn:
      - FrontendApiGatewayStage # This resource is created as part of the RestApi resource

  FrontendDomainRecord:
    Type: AWS::Route53::RecordSet
    Properties:
      Name:
        !FindInMap [EnvironmentConfiguration, !Ref Environment, frontendDomain]
      Type: A
      HostedZoneId:
        Fn::ImportValue: !Sub ${HostedZoneStackName}-HostedZoneId
      AliasTarget:
        DNSName:
          Fn::ImportValue: !Sub ${CloudFrontStackName}-DistributionDomain
        HostedZoneId: "Z2FDTNDATAQYW2" # CloudFront hosted zone ID
        EvaluateTargetHealth: false

  FrontendApiMapping:
    Type: AWS::ApiGateway::BasePathMapping
    Properties:
      DomainName: !Ref FrontendApiDomain
      RestApiId: !Ref FrontendApiGateway
      Stage: !Ref Environment
    DependsOn:
      - FrontendApiGatewayStage # This resource is created as part of the RestApi resource

  FrontendApiGateway:
    Type: AWS::Serverless::Api
    Metadata:
      checkov:
        skip:
          - id: "CKV_AWS_120"
            comment: "We don't want API Gateway to cache responses"
    Properties:
      StageName: !Ref Environment
      AlwaysDeploy: true
      DisableExecuteApiEndpoint: true
      TracingEnabled: true
      EndpointConfiguration:
        Type: REGIONAL
      BinaryMediaTypes: !If
        - IsLocal
        - !Ref AWS::NoValue
        - - "*/*"
      AccessLogSetting:
        Format: >-
          {
          "requestId": "$context.requestId",
          "requestTime": "$context.requestTime",
          "requestTimeEpoch": "$context.requestTimeEpoch",
          "httpMethod": "$context.httpMethod",
          "domainName": "$context.domainName",
          "path": "$context.path",
          "protocol": "$context.protocol",
          "status": "$context.status",
          "responseLength": "$context.responseLength",
          "responseLatency": "$context.responseLatency",
          "authorizerLatency": "$context.authorizer.latency",
          "integrationLatency": "$context.integrationLatency",
          "integrationErrorMessage": "$context.integrationErrorMessage",
          "errorMessage": "$context.error.message",
          "errorResponseType": "$context.error.responseType",
          "validationErrorString": "$context.error.validationErrorString",
          "xrayTraceId": "$context.xrayTraceId",
          "tlsVersion": "$context.tlsVersion",
          "cipherSuite": "$context.cipherSuite"    
          }
        DestinationArn: !GetAtt FrontendApiGatewayAccessLogGroup.Arn
      MethodSettings:
        - MetricsEnabled: true
          CacheDataEncrypted: true
          ResourcePath: /*
          HttpMethod: "*"
      Tags:
        FMSRegionalPolicy: false

  FrontendApiGatewayAccessLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/apigateway/${FrontendApiGateway}/${Environment}"
      RetentionInDays: 30
      KmsKeyId: !GetAtt CloudWatchEncryptionKey.Arn

  FrontendLambda:
    Type: AWS::Serverless::Function
    Metadata:
      checkov:
        skip:
          - id: "CKV_AWS_116"
            comment: "This lambda does not need a dead letter queue"
      BuildMethod: makefile
    Properties:
      CodeUri: solutions/frontend/dist
      Handler: lambda.handler
      ReservedConcurrentExecutions: 500
      DeploymentPreference:
        Alarms:
          - !Ref FrontendLambdaErrorsAlarm
          - !Ref FrontendLambdaThrottlesAlarm
          - !Ref FrontendLambdaAvailabilityAlarm
          - !Ref FrontendLambdaLogErrorAlarm
      LoggingConfig:
        LogGroup: !Ref FrontendLambdaLogGroup
      Events:
        Root:
          Type: Api
          Properties:
            Method: ANY
            Path: /
            RestApiId: !Ref FrontendApiGateway
        CatchAll:
          Type: Api
          Properties:
            Method: ANY
            Path: /{proxy+}
            RestApiId: !Ref FrontendApiGateway
      Environment:
        Variables:
          SESSIONS_SIGNER: !Sub "{{resolve:secretsmanager:${SessionSecret}:SecretString}}"
          SESSIONS_TABLE_NAME: !Sub ${AWS::StackName}-SessionStore
          ROOT_DOMAIN_WITH_ENV:
            !FindInMap [
              EnvironmentConfiguration,
              !Ref Environment,
              rootDomainWithEnv,
            ]
          AUTH_FRONTEND_URL:
            !FindInMap [
              EnvironmentConfiguration,
              !Ref Environment,
              authFrontendUrl,
            ]
          ANALYTICS_COOKIE_DOMAIN:
            !FindInMap [
              EnvironmentConfiguration,
              !Ref Environment,
              analyticsCookieDomain,
            ]
          GA4_CONTAINER_ID:
            !FindInMap [
              EnvironmentConfiguration,
              !Ref Environment,
              ga4ContainerId,
            ]
          ANALYTICS_ENABLED:
            !FindInMap [
              EnvironmentConfiguration,
              !Ref Environment,
              analyticsEnabled,
            ]
      Policies:
        - arn:aws:iam::aws:policy/AWSXrayWriteOnlyAccess
        - Statement:
            - Effect: Allow
              Action:
                - dynamodb:DescribeTable
                - dynamodb:PutItem
                - dynamodb:DeleteItem
                - dynamodb:GetItem
                - dynamodb:Scan
                - dynamodb:UpdateItem
              Resource: !GetAtt SessionsTable.Arn

  FrontendLambdaLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/${AWS::StackName}/FrontendLambda"
      RetentionInDays: 30
      KmsKeyId: !GetAtt CloudWatchEncryptionKey.Arn

  FrontendApiGateway5XXErrorsAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      Namespace: AWS/ApiGateway
      MetricName: 5XXError
      Dimensions:
        - Name: ApiName
          Value: !Ref FrontendApiGateway
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 5
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !If
          - IsProduction
          - Fn::ImportValue: !Sub ${AlertsStackName}-SecondLineAlertsTopicArn # CHANGEME change as necessary for your application
          - Fn::ImportValue: !Sub ${AlertsStackName}-WarningAlertsTopicArn # CHANGEME change as necessary for your application

  FrontendApiGatewayHighLatencyAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      Namespace: AWS/ApiGateway
      MetricName: Latency
      Dimensions:
        - Name: ApiName
          Value: !Ref FrontendApiGateway
      Statistic: Average
      Period: 300
      EvaluationPeriods: 2
      Threshold: 5000
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - Fn::ImportValue: !Sub ${AlertsStackName}-WarningAlertsTopicArn # CHANGEME change as necessary for your application

  FrontendLambdaErrorsAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      Namespace: !Sub "${AWS::StackName}/FrontendLambda"
      MetricName: Errors
      Dimensions:
        - Name: FunctionName
          Value: !Ref FrontendLambda
      Statistic: Sum
      Period: 60
      EvaluationPeriods: 3
      DatapointsToAlarm: 3
      Threshold: 3
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !If
          - IsProduction
          - Fn::ImportValue: !Sub ${AlertsStackName}-SecondLineAlertsTopicArn # CHANGEME change as necessary for your application
          - Fn::ImportValue: !Sub ${AlertsStackName}-WarningAlertsTopicArn # CHANGEME change as necessary for your application

  FrontendLambdaThrottlesAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      Namespace: !Sub "${AWS::StackName}/FrontendLambda"
      MetricName: Throttles
      Dimensions:
        - Name: FunctionName
          Value: !Ref FrontendLambda
      Statistic: Sum
      Period: 60
      EvaluationPeriods: 5
      DatapointsToAlarm: 5
      Threshold: 0
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - Fn::ImportValue: !Sub ${AlertsStackName}-WarningAlertsTopicArn # CHANGEME change as necessary for your application

  FrontendLambdaLogErrorMetricFilter:
    Type: AWS::Logs::MetricFilter
    Properties:
      LogGroupName: !Ref FrontendLambdaLogGroup
      FilterPattern: '{ $.level = "ERROR" || $.level = "CRITICAL" }'
      MetricTransformations:
        - MetricNamespace: !Sub "${AWS::StackName}/FrontendLambda"
          MetricName: ErrorAndCriticalLogCount
          MetricValue: "1"
          DefaultValue: 0

  FrontendLambdaLogErrorAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      Namespace: !Sub "${AWS::StackName}/FrontendLambda"
      MetricName: ErrorAndCriticalLogCount
      Statistic: Sum
      Period: 60
      EvaluationPeriods: 3
      DatapointsToAlarm: 3
      Threshold: 3
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !If
          - IsProduction
          - Fn::ImportValue: !Sub ${AlertsStackName}-SecondLineAlertsTopicArn # CHANGEME change as necessary for your application
          - Fn::ImportValue: !Sub ${AlertsStackName}-WarningAlertsTopicArn # CHANGEME change as necessary for your application

  FrontendLambda5XXResponseMetricFilter:
    Type: AWS::Logs::MetricFilter
    Properties:
      LogGroupName: !Ref FrontendLambdaLogGroup
      FilterPattern: '{ $.message = "Response" && $.statusCode >= 500 }'
      MetricTransformations:
        - MetricNamespace: !Sub "${AWS::StackName}/FrontendLambda"
          MetricName: 5XXResponseCount
          MetricValue: "1"
          DefaultValue: 0

  FrontendLambdaResponseCountMetricFilter:
    Type: AWS::Logs::MetricFilter
    Properties:
      LogGroupName: !Ref FrontendLambdaLogGroup
      FilterPattern: '{ $.message = "Response" }'
      MetricTransformations:
        - MetricNamespace: !Sub "${AWS::StackName}/FrontendLambda"
          MetricName: ResponseCount
          MetricValue: "1"
          DefaultValue: 0

  FrontendLambdaAvailabilityAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      Metrics:
        - Id: errors
          MetricStat:
            Metric:
              Namespace: !Sub "${AWS::StackName}/FrontendLambda"
              MetricName: 5XXResponseCount
            Period: 60
            Stat: Sum
          ReturnData: false
        - Id: total
          MetricStat:
            Metric:
              Namespace: !Sub "${AWS::StackName}/FrontendLambda"
              MetricName: ResponseCount
            Period: 60
            Stat: Sum
          ReturnData: false
        - Id: availability
          Expression: "1 - (errors / total)"
          Label: "Availability"
          ReturnData: true
      Threshold: 0.999
      ComparisonOperator: LessThanThreshold
      EvaluationPeriods: 3
      DatapointsToAlarm: 3
      TreatMissingData: notBreaching
      AlarmActions:
        - Fn::ImportValue: !Sub ${AlertsStackName}-WarningAlertsTopicArn # CHANGEME change as necessary for your application

  FrontendLambdaDurationAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      Namespace: !Sub "${AWS::StackName}/FrontendLambda"
      MetricName: Duration
      Dimensions:
        - Name: FunctionName
          Value: !Ref FrontendLambda
      ExtendedStatistic: p90
      Period: 60
      EvaluationPeriods: 15
      DatapointsToAlarm: 15
      Threshold: 1000
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - Fn::ImportValue: !Sub ${AlertsStackName}-WarningAlertsTopicArn # CHANGEME change as necessary for your application

  FrontendLambdaColdStartDurationAnomalyAlarm:
    Type: AWS::CloudWatch::Alarm
    Condition: IsProduction
    Properties:
      Metrics:
        - Id: initDuration
          MetricStat:
            Metric:
              Namespace: AWS/Lambda
              MetricName: InitDuration
              Dimensions:
                - Name: FunctionName
                  Value: !Ref FrontendLambda
            Period: 300
            Stat: p90
          ReturnData: true
        - Id: band
          Expression: ANOMALY_DETECTION_BAND(initDuration, 2)
          ReturnData: true
      ComparisonOperator: GreaterThanUpperThreshold
      ThresholdMetricId: band
      EvaluationPeriods: 3
      DatapointsToAlarm: 3
      TreatMissingData: notBreaching
      ActionsEnabled: false
      AlarmActions:
        - Fn::ImportValue: !Sub ${AlertsStackName}-WarningAlertsTopicArn # CHANGEME change as necessary for your application

  FrontendApiGatewayTrafficAnomalyAlarm:
    Type: AWS::CloudWatch::Alarm
    Condition: IsProduction
    Properties:
      Metrics:
        - Id: traffic
          MetricStat:
            Metric:
              Namespace: AWS/ApiGateway
              MetricName: Count
              Dimensions:
                - Name: ApiName
                  Value: !Ref FrontendApiGateway
            Period: 300
            Stat: Sum
          ReturnData: true
        - Id: band
          Expression: ANOMALY_DETECTION_BAND(traffic, 2)
          ReturnData: true
      ComparisonOperator: LessThanLowerThreshold
      ThresholdMetricId: band
      EvaluationPeriods: 3
      DatapointsToAlarm: 3
      TreatMissingData: notBreaching
      ActionsEnabled: false
      AlarmActions:
        - Fn::ImportValue: !Sub ${AlertsStackName}-SecondLineAlertsTopicArn # CHANGEME change as necessary for your application
